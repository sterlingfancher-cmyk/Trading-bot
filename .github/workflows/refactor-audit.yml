name: Refactor, Ownership, Configuration, State, Decision, Runtime, Startup, and Research Audit

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "requirements.txt"
      - "VALIDATION_POLICY.md"
      - "REFACTOR_AUDIT_POLICY.md"
      - "ARCHITECTURE_AUDIT_BASELINE.md"
      - "architecture_ownership_registry.json"
      - "typed_configuration_contract.json"
      - "state_store_contract.json"
      - "shadow_decision_comparison_contract.json"
      - "runtime_shadow_capture_contract.json"
      - ".github/workflows/refactor-audit.yml"
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "requirements.txt"
      - "VALIDATION_POLICY.md"
      - "REFACTOR_AUDIT_POLICY.md"
      - "ARCHITECTURE_AUDIT_BASELINE.md"
      - "architecture_ownership_registry.json"
      - "typed_configuration_contract.json"
      - "state_store_contract.json"
      - "shadow_decision_comparison_contract.json"
      - "runtime_shadow_capture_contract.json"
      - ".github/workflows/refactor-audit.yml"
  schedule:
    - cron: "30 12 * * 0"
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

jobs:
  refactor-audit:
    if: github.event_name != 'schedule' || github.event.schedule == '30 12 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Run structural audit
        id: audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$BASE_SHA" ]; then
            python refactor_audit_cli.py \
              --json refactor_audit_report.json \
              --markdown refactor_audit_report.md
          else
            python refactor_audit_cli.py \
              --base "$BASE_SHA" \
              --json refactor_audit_report.json \
              --markdown refactor_audit_report.md \
              --fail-on-new-critical
          fi

      - name: Validate architecture ownership contract
        id: contract
        if: always()
        run: |
          test -f refactor_audit_report.json
          python architecture_contract_validation.py \
            --audit refactor_audit_report.json \
            --registry architecture_ownership_registry.json \
            --json architecture_contract_report.json \
            --markdown architecture_contract_report.md

      - name: Validate typed configuration parity
        id: configuration
        if: always()
        run: |
          test -f refactor_audit_report.json
          python typed_configuration_snapshot.py \
            --audit refactor_audit_report.json \
            --contract typed_configuration_contract.json \
            --json typed_configuration_report.json \
            --markdown typed_configuration_report.md

      - name: Test immutable Stage B models
        id: stage_b_models
        if: always()
        run: python -m unittest -v test_architecture_stage_b.py

      - name: Validate StateStore shadow parity
        id: state_store
        if: always()
        run: |
          test -f refactor_audit_report.json
          test -f typed_configuration_report.json
          python state_store_shadow.py \
            --contract state_store_contract.json \
            --audit refactor_audit_report.json \
            --typed-config typed_configuration_report.json \
            --json state_store_report.json \
            --markdown state_store_report.md

      - name: Test Stage C StateStore shadow
        id: stage_c_tests
        if: always()
        run: python -m unittest -v test_state_store_stage_c.py

      - name: Test Stage D shadow comparison
        id: stage_d_tests
        if: always()
        run: python -m unittest -v test_shadow_decision_stage_d.py

      - name: Test Stage D runtime capture
        id: runtime_shadow_tests
        if: always()
        run: python -m unittest -v test_runtime_shadow_capture.py

      - name: Test self-check runtime classification
        id: self_check_tests
        if: always()
        run: python -m unittest -v test_self_check_runtime_classification.py

      - name: Install declared runtime dependencies
        id: runtime_dependencies
        if: always()
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run exact Gunicorn startup smoke
        id: startup_smoke
        if: always()
        env:
          PORT: "8765"
          DEFERRED_WSGI_BOOTSTRAP: "true"
          WEB_WORKER_ALLOW_HEAVY_RESEARCH: "false"
          PERFORMANCE_AUDIT_AUTO_BACKTEST_ENABLED: "false"
          PERFORMANCE_AUDIT_V2_AUTO_BACKTEST_ENABLED: "false"
          PERFORMANCE_AUDIT_V2_ENABLED: "false"
        run: |
          rm -f startup_gunicorn.log bootstrap_status.json bootstrap_root.json
          PYTHONPATH=bootstrap:. gunicorn bootstrap_wsgi:app \
            --bind 127.0.0.1:$PORT \
            --workers 1 \
            --threads 4 \
            --timeout 180 \
            >startup_gunicorn.log 2>&1 &
          GUNICORN_PID=$!
          cleanup() {
            kill "$GUNICORN_PID" 2>/dev/null || true
            wait "$GUNICORN_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail \
              "http://127.0.0.1:$PORT/bootstrap-status" \
              >bootstrap_status.json; then
              break
            fi
            if ! kill -0 "$GUNICORN_PID" 2>/dev/null; then
              echo "Gunicorn exited before bootstrap status became reachable"
              cat startup_gunicorn.log
              exit 1
            fi
            sleep 2
          done

          test -s bootstrap_status.json || {
            echo "Bootstrap status never became reachable"
            cat startup_gunicorn.log
            exit 1
          }

          ready=false
          for _ in $(seq 1 45); do
            state=$(python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("bootstrap_status.json").read_text())
          print(row.get("status", "unknown"))
          PY
          )
            if [ "$state" = "ready" ]; then
              ready=true
              break
            fi
            if [ "$state" = "error" ]; then
              echo "Deferred application reported a startup error"
              cat bootstrap_status.json
              cat startup_gunicorn.log
              exit 1
            fi
            sleep 2
            curl --silent --show-error --fail \
              "http://127.0.0.1:$PORT/bootstrap-status" \
              >bootstrap_status.json
          done

          if [ "$ready" != "true" ]; then
            echo "Deferred application did not become ready in the bounded window"
            cat bootstrap_status.json
            cat startup_gunicorn.log
            exit 1
          fi

          curl --silent --show-error --fail \
            "http://127.0.0.1:$PORT/" \
            >bootstrap_root.json
          cat bootstrap_status.json

      - name: Read audit summary
        id: summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          audit_path = Path("refactor_audit_report.json")
          contract_path = Path("architecture_contract_report.json")
          config_path = Path("typed_configuration_report.json")
          state_path = Path("state_store_report.json")

          if not audit_path.exists():
              print("new_critical=unknown")
          else:
              report = json.loads(audit_path.read_text())
              comparison = report.get("comparison", {})
              print(f"new_critical={len(comparison.get('new_critical', []))}")

          if not contract_path.exists():
              print("contract_violations=unknown")
          else:
              contract = json.loads(contract_path.read_text())
              print(f"contract_violations={len(contract.get('violations', []))}")

          if not config_path.exists():
              print("configuration_violations=unknown")
          else:
              config = json.loads(config_path.read_text())
              print(f"configuration_violations={len(config.get('violations', []))}")

          if not state_path.exists():
              print("state_store_status=missing")
          else:
              state = json.loads(state_path.read_text())
              print(f"state_store_status={state.get('status', 'unknown')}")
          PY

      - name: Upload refactor and startup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-audit-report
          path: |
            refactor_audit_report.json
            refactor_audit_report.md
            architecture_contract_report.json
            architecture_contract_report.md
            typed_configuration_report.json
            typed_configuration_report.md
            state_store_report.json
            state_store_report.md
            startup_gunicorn.log
            bootstrap_status.json
            bootstrap_root.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish refactor audit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ steps.audit.outcome }}' === 'success' &&
              '${{ steps.contract.outcome }}' === 'success' &&
              '${{ steps.configuration.outcome }}' === 'success' &&
              '${{ steps.stage_b_models.outcome }}' === 'success' &&
              '${{ steps.state_store.outcome }}' === 'success' &&
              '${{ steps.stage_c_tests.outcome }}' === 'success' &&
              '${{ steps.stage_d_tests.outcome }}' === 'success' &&
              '${{ steps.runtime_shadow_tests.outcome }}' === 'success' &&
              '${{ steps.self_check_tests.outcome }}' === 'success' &&
              '${{ steps.runtime_dependencies.outcome }}' === 'success' &&
              '${{ steps.startup_smoke.outcome }}' === 'success';
            const newCritical = '${{ steps.summary.outputs.new_critical }}';
            const ownership = '${{ steps.summary.outputs.contract_violations }}';
            const configuration = '${{ steps.summary.outputs.configuration_violations }}';
            const stateStore = '${{ steps.summary.outputs.state_store_status }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'refactor-audit',
              description: passed
                ? `Structure, ownership, parity, shadow, diagnostics, and startup passed`
                : `${newCritical} critical; ${ownership} owner; ${configuration} config; state ${stateStore}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  runtime-research-snapshot:
    needs: [refactor-audit]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.event.schedule == '15 23 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Allow Railway deployment to settle
        if: github.event_name == 'push'
        run: sleep 75

      - name: Capture read-only Railway research state
        id: snapshot
        run: |
          python runtime_research_snapshot.py \
            --retries 2 \
            --timeout 20 \
            --json runtime_research_snapshot.json \
            --markdown runtime_research_snapshot.md

      - name: Read runtime snapshot summary
        id: runtime_summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("runtime_research_snapshot.json")
          if not path.exists():
              print("snapshot_status=missing")
              print("self_check=unknown")
              print("reachable=unknown")
          else:
              report = json.loads(path.read_text())
              summary = report.get("summary", {})
              connectivity = summary.get("connectivity", {})
              print(f"snapshot_status={report.get('status', 'unknown')}")
              print(f"self_check={summary.get('self_check', {}).get('overall', 'unknown')}")
              print(f"reachable={connectivity.get('reachable_count', 0)}/{connectivity.get('total_count', 0)}")
          PY

      - name: Upload runtime research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-research-snapshot
          path: |
            runtime_research_snapshot.json
            runtime_research_snapshot.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish runtime snapshot status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const captured = '${{ steps.snapshot.outcome }}' === 'success';
            const state = '${{ steps.runtime_summary.outputs.snapshot_status }}';
            const selfCheck = '${{ steps.runtime_summary.outputs.self_check }}';
            const reachable = '${{ steps.runtime_summary.outputs.reachable }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: captured ? 'success' : 'failure',
              context: 'research-snapshot',
              description: captured
                ? `Runtime ${state}; self-check ${selfCheck}; reachable ${reachable}`
                : 'Unable to capture Railway runtime state',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
