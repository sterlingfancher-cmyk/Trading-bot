name: Refactor and Structural Code Audit

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "**/*.py"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/refactor-audit.yml"
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/refactor-audit.yml"
  schedule:
    # Sunday 12:30 UTC; approximately 7:30 AM Central during daylight time.
    - cron: "30 12 * * 0"
  workflow_dispatch:

jobs:
  refactor-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run structural audit
        id: audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$BASE_SHA" ]; then
            python refactor_audit_cli.py \
              --json refactor_audit_report.json \
              --markdown refactor_audit_report.md
          else
            python refactor_audit_cli.py \
              --base "$BASE_SHA" \
              --json refactor_audit_report.json \
              --markdown refactor_audit_report.md \
              --fail-on-new-critical
          fi

      - name: Read audit summary
        id: summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("refactor_audit_report.json")
          if not path.exists():
              print("critical=unknown")
              print("warnings=unknown")
              print("new_critical=unknown")
              print("new_warnings=unknown")
          else:
              report = json.loads(path.read_text())
              summary = report.get("current", {}).get("summary", {})
              comparison = report.get("comparison", {})
              print(f"critical={summary.get('critical_findings', 0)}")
              print(f"warnings={summary.get('warning_findings', 0)}")
              print(f"new_critical={len(comparison.get('new_critical', []))}")
              print(f"new_warnings={len(comparison.get('new_warnings', []))}")
          PY

      - name: Upload refactor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-audit-report
          path: |
            refactor_audit_report.json
            refactor_audit_report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish refactor audit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.audit.outcome }}' === 'success';
            const newCritical = '${{ steps.summary.outputs.new_critical }}';
            const newWarnings = '${{ steps.summary.outputs.new_warnings }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'refactor-audit',
              description: passed
                ? `No new critical debt; ${newWarnings} new warnings`
                : `${newCritical} new critical findings require review`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
