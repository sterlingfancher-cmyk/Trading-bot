name: Capture Current Paper State

on:
  push:
    branches: [state-capture-20260804]
    paths:
      - ".github/workflows/capture-current-paper-state.yml"

jobs:
  capture-current-paper-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture read-only paper state surfaces
        id: capture
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          base = "https://web-production-e1796.up.railway.app"
          endpoints = {
              "broad_momentum_force": "/paper/broad-momentum-discovery-status?force=1",
              "broad_momentum_status": "/paper/broad-momentum-discovery-status",
              "broad_momentum_candidates": "/paper/broad-momentum-candidates?limit=100",
              "paper_status_full": "/paper/status?full=1",
              "paper_status": "/paper/status",
              "daily_audit": "/paper/daily-audit",
              "journal_truth": "/paper/journal-truth-status",
              "state_provenance": "/paper/state-provenance-status",
              "state_persistence": "/paper/state-persistence-contract-status",
              "cycle_completion": "/paper/cycle-completion-contract-status",
              "runtime_shadow": "/paper/runtime-shadow-capture-status",
              "ml2_status": "/paper/ml2-status",
              "ml_counterfactual_ledger": "/paper/ml-counterfactual-ledger-status",
              "ml_counterfactual_dataset": "/paper/ml-counterfactual-training-dataset?limit=50",
          }
          manifest = {"base_url": base, "read_only": True, "endpoints": {}}
          for name, path in endpoints.items():
              target = pathlib.Path(f"capture_{name}.json")
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "paper-state-capture/1.3"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      target.write_bytes(raw)
                      manifest["endpoints"][name] = {
                          "status": "ok",
                          "http_status": getattr(response, "status", 200),
                          "path": path,
                          "bytes": len(raw),
                      }
              except Exception as exc:
                  target.write_text(json.dumps({"status": "error", "error": f"{type(exc).__name__}: {exc}", "path": path}, indent=2) + "\n")
                  manifest["endpoints"][name] = {
                      "status": "error",
                      "path": path,
                      "error": f"{type(exc).__name__}: {exc}",
                  }
              if name == "broad_momentum_force":
                  time.sleep(10)
          pathlib.Path("capture_manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          required = (
              "broad_momentum_force",
              "broad_momentum_status",
              "broad_momentum_candidates",
              "paper_status_full",
              "daily_audit",
              "state_persistence",
              "cycle_completion",
              "ml_counterfactual_ledger",
          )
          failed = [name for name in required if manifest["endpoints"][name]["status"] != "ok"]
          if failed:
              raise SystemExit("required capture failed: " + ",".join(failed))
          PY

      - name: Upload paper-state capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-paper-state-capture
          path: |
            capture_manifest.json
            capture_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish capture status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.capture.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'state-capture',
              description: passed ? 'Current paper state captured read-only' : 'Paper-state capture failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
