name: Daily Operational Audit Validation

on:
  push:
    branches: [main]
    paths:
      - "daily_operational_audit.py"
      - "daily_audit_repair_overlay.py"
      - "daily_data_integrity_audit_overlay.py"
      - "data_integrity_startup_bridge.py"
      - "provider_request_accounting_overlay.py"
      - "bootstrap_wsgi.py"
      - "cycle_completion_contract.py"
      - "provider_timeout_contract.py"
      - "state_persistence_contract.py"
      - "runtime_worker_registration.py"
      - "bootstrap/sitecustomize.py"
      - "test_daily_operational_audit.py"
      - "test_runtime_repair_contracts.py"
      - "test_daily_data_integrity_overlay_v2.py"
      - "usercustomize.py"
      - ".github/workflows/daily-operational-audit.yml"
  workflow_dispatch:

jobs:
  validate-daily-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run targeted daily-audit and repair tests
        id: targeted_tests
        run: |
          python -m unittest -v \
            test_daily_operational_audit.py \
            test_runtime_repair_contracts.py \
            test_daily_data_integrity_overlay_v2.py

      - name: Wait for the repaired Railway runtime
        id: deployment_ready
        run: |
          base=https://web-production-e1796.up.railway.app
          expected=cycle-completion-contract-2026-08-04-v2-rebind-safe
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 20 \
              "$base/paper/cycle-completion-contract-status" \
              > cycle_completion_contract_live.json; then
              version=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              row = json.loads(Path("cycle_completion_contract_live.json").read_text())
              print(row.get("version", ""))
          except Exception:
              print("")
          PY
              )
              if [ "$version" = "$expected" ]; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Repaired Railway runtime did not become reachable with $expected"
            cat cycle_completion_contract_live.json 2>/dev/null || true
            exit 1
          fi

      - name: Capture live repair contracts
        id: live_validation
        run: |
          base=https://web-production-e1796.up.railway.app
          for spec in \
            "bootstrap_status_live.json:/bootstrap-status" \
            "cycle_completion_contract_live.json:/paper/cycle-completion-contract-status" \
            "state_persistence_contract_live.json:/paper/state-persistence-contract-status" \
            "provider_timeout_contract_live.json:/paper/provider-timeout-contract-status" \
            "daily_operational_audit_live.json:/paper/daily-audit?full=1"; do
            file=${spec%%:*}
            path=${spec#*:}
            curl --silent --show-error --fail \
              --retry 12 \
              --retry-delay 8 \
              --retry-all-errors \
              --max-time 20 \
              "$base$path" \
              > "$file"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          bootstrap = json.loads(Path("bootstrap_status_live.json").read_text(encoding="utf-8"))
          daily = json.loads(Path("daily_operational_audit_live.json").read_text(encoding="utf-8"))
          cycle = json.loads(Path("cycle_completion_contract_live.json").read_text(encoding="utf-8"))
          state = json.loads(Path("state_persistence_contract_live.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("provider_timeout_contract_live.json").read_text(encoding="utf-8"))
          sections = daily.get("sections")
          contract = daily.get("performance_contract", {})
          authority = daily.get("authority", {})
          conclusion = (sections or {}).get("11_conclusion", {})
          integrity = (sections or {}).get("10b_market_data_and_path_integrity", {})
          accounting = integrity.get("provider_request_accounting", {})

          assert bootstrap.get("status") == "ready", bootstrap
          assert bootstrap.get("delegate_ready") is True, bootstrap
          assert bootstrap.get("version") == "deferred-wsgi-bootstrap-2026-08-20-v7-pre-wsgi-fresh-risk-guard", bootstrap
          assert isinstance(bootstrap.get("registration_duration_seconds"), (int, float)), bootstrap
          assert daily.get("status") == "ok", daily
          assert daily.get("type") == "daily_operational_audit", daily
          assert isinstance(sections, dict) and len(sections) == 13, sections
          assert daily.get("repair_overlay_version"), daily
          assert daily.get("data_integrity_overlay_version"), daily
          assert contract.get("route_fanout_count") == 0, contract
          assert contract.get("external_provider_calls") == 0, contract
          assert contract.get("trading_actions") == 0, contract
          assert contract.get("repair_actions") == 0, contract
          assert contract.get("bounded_output") is True, contract
          assert authority.get("reporting_only") is True, authority
          assert float(daily.get("duration_seconds", 999.0)) <= 5.0, daily.get("duration_seconds")
          assert conclusion.get("status") in {"pass", "warn", "fail"}, conclusion
          assert conclusion.get("checked_sections") == 11, conclusion
          assert integrity.get("status") in {"pass", "warn", "fail"}, integrity
          assert isinstance(accounting.get("in_flight_or_unclassified_requests"), int), accounting
          assert isinstance(accounting.get("accounting_complete_at_snapshot"), bool), accounting
          assert sections.get("12_next_action", {}).get("status") in {"none", "required"}

          assert cycle.get("status") == "ok" and cycle.get("installed") is True, cycle
          assert cycle.get("version") == "cycle-completion-contract-2026-08-04-v2-rebind-safe", cycle
          assert cycle.get("cycle_stale") is False, cycle
          assert provider.get("status") == "ok" and provider.get("installed") is True, provider
          assert state.get("status") == "ok", state
          assert state.get("persistent_mount_detected") in {True, False}, state

          print(json.dumps({
              "overall": daily.get("overall"),
              "duration_seconds": daily.get("duration_seconds"),
              "section_count": len(sections),
              "checked_sections": conclusion.get("checked_sections"),
              "registration_duration_seconds": bootstrap.get("registration_duration_seconds"),
              "provider_request_gap": accounting.get("in_flight_or_unclassified_requests"),
              "cycle_health": cycle.get("cycle_health"),
              "cycle_phase": cycle.get("cycle_phase"),
              "cycle_in_progress": cycle.get("cycle_in_progress"),
              "active_cycle_count": cycle.get("active_cycle_count"),
              "detached_completion_reconciled": cycle.get("detached_completion_reconciled"),
              "last_completed_cycle_local": cycle.get("last_completed_cycle_local"),
              "last_completed_cycle_duration_seconds": cycle.get("last_completed_cycle_duration_seconds"),
              "provider_calls": provider.get("health", {}).get("calls"),
              "provider_failures": provider.get("health", {}).get("failed"),
              "persistent_mount_detected": state.get("persistent_mount_detected"),
              "state_file": state.get("state_file"),
              "next_action": sections.get("12_next_action"),
          }, indent=2, sort_keys=True))
          PY

      - name: Read live audit summary
        id: live_summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          daily_path = Path("daily_operational_audit_live.json")
          cycle_path = Path("cycle_completion_contract_live.json")
          state_path = Path("state_persistence_contract_live.json")
          if not daily_path.exists():
              print("overall=unavailable")
              print("duration=unknown")
              print("sections=0")
              print("cycle=unknown")
              print("mount=unknown")
          else:
              daily = json.loads(daily_path.read_text(encoding="utf-8"))
              cycle = json.loads(cycle_path.read_text(encoding="utf-8")) if cycle_path.exists() else {}
              state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
              print(f"overall={daily.get('overall', 'unknown')}")
              print(f"duration={daily.get('duration_seconds', 'unknown')}")
              print(f"sections={len(daily.get('sections', {}))}")
              print(f"cycle={cycle.get('cycle_health', 'unknown')}")
              print(f"mount={state.get('persistent_mount_detected', 'unknown')}")
          PY

      - name: Upload live daily-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-operational-audit-live
          path: |
            bootstrap_status_live.json
            daily_operational_audit_live.json
            cycle_completion_contract_live.json
            state_persistence_contract_live.json
            provider_timeout_contract_live.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish daily audit validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ steps.targeted_tests.outcome }}' === 'success' &&
              '${{ steps.deployment_ready.outcome }}' === 'success' &&
              '${{ steps.live_validation.outcome }}' === 'success';
            const overall = '${{ steps.live_summary.outputs.overall }}';
            const duration = '${{ steps.live_summary.outputs.duration }}';
            const sections = '${{ steps.live_summary.outputs.sections }}';
            const cycle = '${{ steps.live_summary.outputs.cycle }}';
            const mount = '${{ steps.live_summary.outputs.mount }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'daily-operational-audit',
              description: passed
                ? `Live ${overall}; ${sections} sections; ${duration}s; cycle ${cycle}; mount ${mount}`
                : 'Daily audit or runtime repair validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
