name: Daily Operational Audit Validation

on:
  push:
    branches: [main]
    paths:
      - "daily_operational_audit.py"
      - "daily_audit_repair_overlay.py"
      - "daily_data_integrity_audit_overlay.py"
      - "data_integrity_startup_bridge.py"
      - "issue222_verified_flat_successor.py"
      - "test_issue222_verified_flat_successor.py"
      - "canonical_execution_ledger.py"
      - "paper_accounting_integrity_guard.py"
      - "paper_accounting_readonly_status.py"
      - "test_issue126_successor_accounting_reconcile_boundary.py"
      - "provider_request_accounting_overlay.py"
      - "bootstrap_wsgi.py"
      - "cycle_completion_contract.py"
      - "provider_timeout_contract.py"
      - "state_persistence_contract.py"
      - "runtime_worker_registration.py"
      - "bootstrap/sitecustomize.py"
      - "test_daily_operational_audit.py"
      - "test_runtime_repair_contracts.py"
      - "test_daily_data_integrity_overlay_v2.py"
      - "test_daily_operational_audit_workflow.py"
      - "usercustomize.py"
      - ".github/workflows/daily-operational-audit.yml"
  workflow_dispatch:

jobs:
  validate-daily-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run targeted daily-audit and repair tests
        id: targeted_tests
        run: |
          python -m unittest -v \
            test_daily_operational_audit.py \
            test_runtime_repair_contracts.py \
            test_daily_data_integrity_overlay_v2.py \
            test_daily_operational_audit_workflow.py

      - name: Wait for the exact Railway runtime
        id: deployment_ready
        run: |
          base=https://web-production-e1796.up.railway.app
          readarray -t expected < <(python - <<'PY'
          import cycle_completion_contract as cycle
          import issue222_verified_flat_successor as issue222
          print(cycle.VERSION)
          print(issue222.VERSION)
          PY
          )
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 20 \
              "$base/paper/cycle-completion-contract-status" \
              > cycle_completion_contract_live.json \
              && curl --silent --show-error --fail --max-time 20 \
              "$base/paper/issue222-verified-flat-successor-status" \
              > issue222_successor_live.json; then
              readarray -t actual < <(python - <<'PY'
          import json
          from pathlib import Path
          for name in ("cycle_completion_contract_live.json", "issue222_successor_live.json"):
              try:
                  row = json.loads(Path(name).read_text())
                  print(row.get("version", ""))
              except Exception:
                  print("")
          PY
              )
              if [ "${actual[0]}" = "${expected[0]}" ] && [ "${actual[1]}" = "${expected[1]}" ]; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Authoritative Railway runtime did not reach both exact contract versions"
            cat cycle_completion_contract_live.json 2>/dev/null || true
            cat issue222_successor_live.json 2>/dev/null || true
            exit 1
          fi

      - name: Capture live repair contracts
        id: live_validation
        run: |
          base=https://web-production-e1796.up.railway.app
          for spec in \
            "bootstrap_status_live.json:/bootstrap-status" \
            "cycle_completion_contract_live.json:/paper/cycle-completion-contract-status" \
            "state_persistence_contract_live.json:/paper/state-persistence-contract-status" \
            "provider_timeout_contract_live.json:/paper/provider-timeout-contract-status" \
            "issue222_successor_live.json:/paper/issue222-verified-flat-successor-status" \
            "canonical_ledger_live.json:/paper/canonical-execution-ledger-status" \
            "accounting_integrity_live.json:/paper/accounting-integrity-status" \
            "trade_journal_live.json:/paper/trade-journal?full=1" \
            "daily_operational_audit_live.json:/paper/daily-audit?full=1"; do
            file=${spec%%:*}
            path=${spec#*:}
            curl --silent --show-error --fail \
              --retry 12 \
              --retry-delay 8 \
              --retry-all-errors \
              --max-time 20 \
              "$base$path" \
              > "$file"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          import cycle_completion_contract as cycle_contract

          bootstrap = json.loads(Path("bootstrap_status_live.json").read_text(encoding="utf-8"))
          daily = json.loads(Path("daily_operational_audit_live.json").read_text(encoding="utf-8"))
          cycle = json.loads(Path("cycle_completion_contract_live.json").read_text(encoding="utf-8"))
          state = json.loads(Path("state_persistence_contract_live.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("provider_timeout_contract_live.json").read_text(encoding="utf-8"))
          successor = json.loads(Path("issue222_successor_live.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("canonical_ledger_live.json").read_text(encoding="utf-8"))
          accounting_integrity = json.loads(Path("accounting_integrity_live.json").read_text(encoding="utf-8"))
          trade_journal = json.loads(Path("trade_journal_live.json").read_text(encoding="utf-8"))
          affected_symbols = {"GEV", "SPCX", "ACHR"}
          affected_execution_ids = {
              "9554247470c54fe9a00598da6a346f46",
              "96cdc732bf6b475098a9b6887ac76fa7",
              "9cad03cbec994e29a9b65293d573f54b",
              "c90260025d4b4eed8b3a0029e0267b5f",
              "10d56e9128cc4afe896df89b01df137c",
          }
          affected_journal_rows = [
              row for row in trade_journal.get("trades", [])
              if isinstance(row, dict)
              and (
                  str(row.get("symbol") or "").upper() in affected_symbols
                  or str(row.get("execution_id") or "") in affected_execution_ids
              )
          ]
          sections = daily.get("sections")
          contract = daily.get("performance_contract", {})
          authority = daily.get("authority", {})
          conclusion = (sections or {}).get("11_conclusion", {})
          integrity = (sections or {}).get("10b_market_data_and_path_integrity", {})
          accounting = integrity.get("provider_request_accounting", {})

          assert bootstrap.get("status") == "ready", bootstrap
          assert bootstrap.get("delegate_ready") is True, bootstrap
          assert bootstrap.get("version") == "deferred-wsgi-bootstrap-2026-08-20-v7-pre-wsgi-fresh-risk-guard", bootstrap
          assert isinstance(bootstrap.get("registration_duration_seconds"), (int, float)), bootstrap
          assert daily.get("status") == "ok", daily
          assert daily.get("type") == "daily_operational_audit", daily
          assert isinstance(sections, dict) and len(sections) == 13, sections
          assert daily.get("repair_overlay_version"), daily
          assert daily.get("data_integrity_overlay_version"), daily
          assert contract.get("route_fanout_count") == 0, contract
          assert contract.get("external_provider_calls") == 0, contract
          assert contract.get("trading_actions") == 0, contract
          assert contract.get("repair_actions") == 0, contract
          assert contract.get("bounded_output") is True, contract
          assert authority.get("reporting_only") is True, authority
          assert float(daily.get("duration_seconds", 999.0)) <= 5.0, daily.get("duration_seconds")
          assert conclusion.get("status") in {"pass", "warn", "fail"}, conclusion
          assert conclusion.get("checked_sections") == 11, conclusion
          assert integrity.get("status") in {"pass", "warn", "fail"}, integrity
          assert isinstance(accounting.get("in_flight_or_unclassified_requests"), int), accounting
          assert isinstance(accounting.get("accounting_complete_at_snapshot"), bool), accounting
          assert sections.get("12_next_action", {}).get("status") in {"none", "required"}

          assert cycle.get("status") == "ok" and cycle.get("installed") is True, cycle
          assert cycle.get("version") == cycle_contract.VERSION, cycle
          assert cycle.get("cycle_stale") is False, cycle
          assert provider.get("status") == "ok" and provider.get("installed") is True, provider
          assert state.get("status") == "ok", state
          assert state.get("persistent_mount_detected") in {True, False}, state

          print(json.dumps({
              "issue222_raw": successor,
              "issue222_trade_journal_evidence": affected_journal_rows,
              "trade_journal_row_count": len(trade_journal.get("trades", [])),
          }, indent=2, sort_keys=True, default=str))
          assert trade_journal.get("status") == "ok", trade_journal
          assert successor.get("status") == "validation_hold", successor
          assert successor.get("overall") == "pass", successor
          assert successor.get("type") == "issue222_verified_flat_successor_status", successor
          assert successor.get("epoch_id") == "stable-paper-v5-20260914-issue222-flat-successor01", successor
          assert successor.get("prior_epoch_id") == "stable-paper-v4-20260826-successor01", successor
          assert successor.get("historical_evidence_archived") is True, successor
          assert successor.get("validation_hold") is True, successor
          assert successor.get("canonical_ledger_unchanged") is True, successor
          assert successor.get("unresolved_prior_discrepancy") is True, successor
          assert successor.get("prior_epoch_economics_promotable") is False, successor
          assert successor.get("fabricated_exit_rows") == 0, successor
          assert successor.get("state_trade_rows") == 0, successor
          assert successor.get("positions") == [], successor
          assert successor.get("projection_halt_preserved") is True, successor
          assert successor.get("projection_halt_reason") == "canonical execution/state projection divergence", successor

          assert ledger.get("status") == "ok" and ledger.get("overall") == "pass", ledger
          assert ledger.get("chain_valid") is True, ledger
          assert ledger.get("row_count") == 88, ledger
          assert ledger.get("current_epoch_id") == successor.get("epoch_id"), ledger
          assert ledger.get("current_epoch_rows") == 0, ledger
          assert ledger.get("state_current_epoch_rows") == 0, ledger
          assert ledger.get("state_projection_parity") is True, ledger
          assert ledger.get("missing_from_state_count") == 0, ledger
          assert ledger.get("missing_from_ledger_count") == 0, ledger

          assert accounting_integrity.get("status") == "ok", accounting_integrity
          assert accounting_integrity.get("overall") == "pass", accounting_integrity
          assert accounting_integrity.get("coverage_complete") is True, accounting_integrity
          assert accounting_integrity.get("discrepancy_count_remaining") == 0, accounting_integrity
          assert accounting_integrity.get("repaired") is False, accounting_integrity
          assert accounting_integrity.get("successor_validation_hold_read_only") is True, accounting_integrity

          print(json.dumps({
              "overall": daily.get("overall"),
              "duration_seconds": daily.get("duration_seconds"),
              "section_count": len(sections),
              "checked_sections": conclusion.get("checked_sections"),
              "registration_duration_seconds": bootstrap.get("registration_duration_seconds"),
              "provider_request_gap": accounting.get("in_flight_or_unclassified_requests"),
              "cycle_health": cycle.get("cycle_health"),
              "cycle_phase": cycle.get("cycle_phase"),
              "cycle_in_progress": cycle.get("cycle_in_progress"),
              "active_cycle_count": cycle.get("active_cycle_count"),
              "detached_completion_reconciled": cycle.get("detached_completion_reconciled"),
              "last_completed_cycle_local": cycle.get("last_completed_cycle_local"),
              "last_completed_cycle_duration_seconds": cycle.get("last_completed_cycle_duration_seconds"),
              "provider_calls": provider.get("health", {}).get("calls"),
              "provider_failures": provider.get("health", {}).get("failed"),
              "persistent_mount_detected": state.get("persistent_mount_detected"),
              "state_file": state.get("state_file"),
              "issue222_successor": {
                  "status": successor.get("status"),
                  "epoch_id": successor.get("epoch_id"),
                  "validation_hold": successor.get("validation_hold"),
                  "unresolved_prior_discrepancy": successor.get("unresolved_prior_discrepancy"),
                  "prior_epoch_economics_promotable": successor.get("prior_epoch_economics_promotable"),
                  "fabricated_exit_rows": successor.get("fabricated_exit_rows"),
                  "state_trade_rows": successor.get("state_trade_rows"),
                  "positions": successor.get("positions"),
                  "cash": successor.get("cash"),
                  "equity": successor.get("equity"),
                  "projection_halt_preserved": successor.get("projection_halt_preserved"),
                  "canonical_ledger_unchanged": successor.get("canonical_ledger_unchanged"),
              },
              "canonical_ledger": {
                  "row_count": ledger.get("row_count"),
                  "chain_valid": ledger.get("chain_valid"),
                  "current_epoch_rows": ledger.get("current_epoch_rows"),
                  "state_current_epoch_rows": ledger.get("state_current_epoch_rows"),
                  "state_projection_parity": ledger.get("state_projection_parity"),
              },
              "accounting_integrity": {
                  "status": accounting_integrity.get("status"),
                  "coverage_complete": accounting_integrity.get("coverage_complete"),
                  "discrepancy_count_remaining": accounting_integrity.get("discrepancy_count_remaining"),
                  "repaired": accounting_integrity.get("repaired"),
                  "successor_validation_hold_read_only": accounting_integrity.get("successor_validation_hold_read_only"),
              },
              "next_action": sections.get("12_next_action"),
          }, indent=2, sort_keys=True))
          PY

      - name: Read live audit summary
        id: live_summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          daily_path = Path("daily_operational_audit_live.json")
          cycle_path = Path("cycle_completion_contract_live.json")
          state_path = Path("state_persistence_contract_live.json")
          if not daily_path.exists():
              print("overall=unavailable")
              print("duration=unknown")
              print("sections=0")
              print("cycle=unknown")
              print("mount=unknown")
          else:
              daily = json.loads(daily_path.read_text(encoding="utf-8"))
              cycle = json.loads(cycle_path.read_text(encoding="utf-8")) if cycle_path.exists() else {}
              state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
              print(f"overall={daily.get('overall', 'unknown')}")
              print(f"duration={daily.get('duration_seconds', 'unknown')}")
              print(f"sections={len(daily.get('sections', {}))}")
              print(f"cycle={cycle.get('cycle_health', 'unknown')}")
              print(f"mount={state.get('persistent_mount_detected', 'unknown')}")
          PY

      - name: Upload live daily-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-operational-audit-live
          path: |
            bootstrap_status_live.json
            daily_operational_audit_live.json
            cycle_completion_contract_live.json
            state_persistence_contract_live.json
            provider_timeout_contract_live.json
            issue222_successor_live.json
            canonical_ledger_live.json
            accounting_integrity_live.json
            trade_journal_live.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish daily audit validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ steps.targeted_tests.outcome }}' === 'success' &&
              '${{ steps.deployment_ready.outcome }}' === 'success' &&
              '${{ steps.live_validation.outcome }}' === 'success';
            const overall = '${{ steps.live_summary.outputs.overall }}';
            const duration = '${{ steps.live_summary.outputs.duration }}';
            const sections = '${{ steps.live_summary.outputs.sections }}';
            const cycle = '${{ steps.live_summary.outputs.cycle }}';
            const mount = '${{ steps.live_summary.outputs.mount }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'daily-operational-audit',
              description: passed
                ? `Live ${overall}; ${sections} sections; ${duration}s; cycle ${cycle}; mount ${mount}`
                : 'Daily audit or runtime repair validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
