name: One-Time Sitecustomize Bootstrap Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-sitecustomize.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact bounded bootstrap repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sitecustomize.py")
          text = path.read_text(encoding="utf-8")

          old_imports = "import datetime as dt\nimport threading\n"
          new_imports = "import datetime as dt\nimport os\nimport threading\n"
          if old_imports not in text:
              raise SystemExit("expected import block not found")
          text = text.replace(old_imports, new_imports, 1)

          old_boundary = "from typing import Any\n\nVERSION ="
          new_boundary = '''from typing import Any

# Python imports sitecustomize before Gunicorn loads its configuration. Enforce
# the advisory-research boundary here so historical backtests cannot start in
# the single paper-trading web worker during interpreter startup.
if os.environ.get("WEB_WORKER_ALLOW_HEAVY_RESEARCH", "false").lower() not in {
    "1", "true", "yes", "on"
}:
    os.environ["PERFORMANCE_AUDIT_AUTO_BACKTEST_ENABLED"] = "false"
    os.environ["PERFORMANCE_AUDIT_V2_AUTO_BACKTEST_ENABLED"] = "false"
    os.environ["PERFORMANCE_AUDIT_V2_ENABLED"] = "false"

VERSION ='''
          if old_boundary not in text:
              raise SystemExit("expected version boundary not found")
          text = text.replace(old_boundary, new_boundary, 1)

          old_watchdog = '''def _watchdog() -> None:
    for _ in range(1800):
        try:
            _register_all()
        except Exception:
            pass
        time.sleep(0.1)
'''
          new_watchdog = '''def _watchdog() -> None:
    """Bounded startup retry; stop once the Flask app is registered."""
    for _ in range(12):
        try:
            m = _mod()
            flask_app = getattr(m, "app", None) if m is not None else None
            _register_all(flask_app, m)
            if flask_app is not None and id(flask_app) in _REGISTERED_APP_IDS:
                return
        except Exception:
            pass
        time.sleep(2.0)
'''
          if old_watchdog not in text:
              raise SystemExit("expected watchdog block not found")
          text = text.replace(old_watchdog, new_watchdog, 1)

          old_tail = '''_register_all()
threading.Thread(target=_watchdog, daemon=True).start()
'''
          new_tail = '''# Flask.__init__ performs event-driven registration when the app is created.
# A short retry thread covers unusual import ordering without reapplying the
# complete patch stack ten times per second for several minutes.
threading.Thread(
    target=_watchdog,
    name="startup-registration-retry",
    daemon=True,
).start()
'''
          if old_tail not in text:
              raise SystemExit("expected startup tail not found")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile sitecustomize.py gunicorn.conf.py wsgi.py
          python repository_validation.py --report sitecustomize_repair_validation.json

      - name: Commit bounded bootstrap repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          git diff --cached --check
          git commit -m "Bound sitecustomize startup registration"
          git push origin HEAD:main
