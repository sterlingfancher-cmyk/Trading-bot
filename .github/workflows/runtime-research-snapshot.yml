name: Runtime Research Snapshot

on:
  push:
    branches: [main]
    paths:
      - "runtime_research_snapshot.py"
      - ".github/workflows/runtime-research-snapshot.yml"
  schedule:
    # Weekdays at 23:15 UTC; approximately 6:15 PM Central during daylight time.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture read-only Railway research state
        id: snapshot
        run: |
          python runtime_research_snapshot.py \
            --json runtime_research_snapshot.json \
            --markdown runtime_research_snapshot.md

      - name: Read snapshot summary
        id: summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("runtime_research_snapshot.json")
          if not path.exists():
              print("snapshot_status=missing")
              print("v2_status=unknown")
              print("self_check=unknown")
          else:
              report = json.loads(path.read_text())
              summary = report.get("summary", {})
              print(f"snapshot_status={report.get('status', 'unknown')}")
              print(f"v2_status={summary.get('v2', {}).get('run_status', 'unknown')}")
              print(f"self_check={summary.get('self_check', {}).get('overall', 'unknown')}")
          PY

      - name: Upload runtime research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-research-snapshot
          path: |
            runtime_research_snapshot.json
            runtime_research_snapshot.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish research snapshot status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const captured = '${{ steps.snapshot.outcome }}' === 'success';
            const state = '${{ steps.summary.outputs.snapshot_status }}';
            const v2 = '${{ steps.summary.outputs.v2_status }}';
            const selfCheck = '${{ steps.summary.outputs.self_check }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: captured ? 'success' : 'failure',
              context: 'research-snapshot',
              description: captured
                ? `Captured: ${state}; V2 ${v2}; self-check ${selfCheck}`
                : 'Unable to capture Railway research state',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
