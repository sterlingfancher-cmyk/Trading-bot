name: Repository Safety and Performance Audit Validation

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "railway.json"
      - "railway.toml"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/performance-audit-validation.yml"
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "railway.json"
      - "railway.toml"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/performance-audit-validation.yml"
  workflow_dispatch:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository-wide validation
        id: validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python repository_validation.py \
              --base "$BASE_SHA" \
              --report repository_validation_report.json
          else
            python repository_validation.py \
              --report repository_validation_report.json
          fi

      - name: Validate Railway config ownership
        id: railway_config
        if: always()
        run: python railway_config_validation.py

      - name: Upload validation inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-report
          path: |
            repository_validation_report.json
            railway_config_validation_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish repository validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ steps.validation.outcome }}' === 'success' &&
              '${{ steps.railway_config.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'repository-validation',
              description: passed
                ? 'Repository safety and Railway config validation passed'
                : 'Repository or Railway config validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
