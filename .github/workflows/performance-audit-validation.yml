name: Repository Safety and Performance Audit Validation

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "railway.json"
      - "railway.toml"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/performance-audit-validation.yml"
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "Procfile"
      - "railway.json"
      - "railway.toml"
      - "VALIDATION_POLICY.md"
      - ".github/workflows/performance-audit-validation.yml"
  workflow_dispatch:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository-wide validation
        id: validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python repository_validation.py \
              --base "$BASE_SHA" \
              --report repository_validation_report.json
          else
            python repository_validation.py \
              --report repository_validation_report.json
          fi

      - name: Validate Railway config ownership
        id: railway_config
        if: always()
        run: python railway_config_validation.py

      - name: Capture live afternoon audit read-only
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'afternoon-audit-capture-20260806-1254'
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          base = "https://web-production-e1796.up.railway.app"
          endpoints = {
              "daily_audit": "/paper/daily-audit",
              "data_integrity_audit": "/paper/data-integrity-audit-status",
              "mae_mfe_integrity": "/paper/mae-mfe-integrity-status",
              "intratrade_path_integrity": "/paper/intratrade-path-integrity-status",
              "yfinance_data_hygiene": "/paper/yfinance-data-hygiene-status",
              "provider_health": "/paper/provider-health-status",
              "paper_status_full": "/paper/status?full=1",
              "scanner_runtime_contract": "/paper/scanner-runtime-contract-status",
              "broad_momentum_status": "/paper/broad-momentum-discovery-status",
              "broad_momentum_candidates": "/paper/broad-momentum-candidates?limit=100",
              "state_persistence": "/paper/state-persistence-contract-status",
              "cycle_completion": "/paper/cycle-completion-contract-status",
              "journal_truth": "/paper/journal-truth-status",
          }
          manifest = {"base_url": base, "read_only": True, "capture_type": "afternoon_audit", "endpoints": {}}
          for name, path in endpoints.items():
              target = pathlib.Path(f"afternoon_{name}.json")
              request = urllib.request.Request(base + path, headers={"Accept": "application/json", "User-Agent": "afternoon-audit-validation/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      target.write_bytes(raw)
                      manifest["endpoints"][name] = {"status": "ok", "http_status": response.status, "path": path, "bytes": len(raw)}
              except Exception as exc:
                  target.write_text(json.dumps({"status": "error", "error": f"{type(exc).__name__}: {exc}", "path": path}, indent=2) + "\n")
                  manifest["endpoints"][name] = {"status": "error", "path": path, "error": f"{type(exc).__name__}: {exc}"}
              time.sleep(1)
          pathlib.Path("afternoon_manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload validation inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-report
          path: |
            repository_validation_report.json
            railway_config_validation_report.json
            afternoon_manifest.json
            afternoon_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish repository validation status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed =
              '${{ steps.validation.outcome }}' === 'success' &&
              '${{ steps.railway_config.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'repository-validation',
              description: passed
                ? 'Repository safety and Railway config validation passed'
                : 'Repository or Railway config validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });