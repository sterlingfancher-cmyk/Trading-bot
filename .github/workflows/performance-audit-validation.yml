name: Performance Audit Validation

on:
  push:
    branches: [main]
    paths:
      - "performance_audit_lab.py"
      - "performance_audit_composition_guard.py"
      - "paper_underdeployment_repair.py"
      - "gunicorn.conf.py"
      - ".github/workflows/performance-audit-validation.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile performance audit stack
        run: |
          python -m py_compile \
            performance_audit_lab.py \
            performance_audit_composition_guard.py \
            paper_underdeployment_repair.py \
            gunicorn.conf.py
